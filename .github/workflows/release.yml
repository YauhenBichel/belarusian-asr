name: Release

# Publishes a tagged version to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# Configure it once at https://pypi.org/manage/account/publishing/ (a "pending publisher" for a new project):
# PyPI project belarusian-asr, owner YauhenBichel, repository belarusian-asr, workflow release.yml, environment pypi.
#
# Tag first, then run this workflow with the same tag:
#   git tag v0.1.0 && git push origin v0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing semver tag to publish (vMAJOR.MINOR.PATCH, for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Require a semver tag
        env:
          VERSION: ${{ inputs.version }}
        run: echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[server]"
      - name: Unit tests on the tagged commit
        run: python -m unittest discover -s tests -q
      - name: The tag must match the package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          packaged="v$(python -c 'import belarusian_asr; print(belarusian_asr.__version__)')"
          test "$packaged" = "$VERSION" || { echo "the package says $packaged, the tag is $VERSION"; exit 1; }

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # Trusted Publishing; no stored credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --quiet build==1.6.1
          python -m build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
