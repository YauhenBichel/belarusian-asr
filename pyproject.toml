[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "belarusian-asr"
dynamic = ["version"]
description = "Belarusian speech recognition on the CPU: NVIDIA's Belarusian FastConformer through ONNX Runtime, with an OpenAI- and whisper.cpp-compatible server and a FLEURS benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yauhen Bichel" }]
keywords = ["belarusian", "speech recognition", "asr", "speech-to-text", "onnx", "fastconformer", "nemo", "whisper"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "onnx-asr>=0.12,<0.13",
  "onnxruntime>=1.20",
  "numpy>=1.26",
  "soundfile>=0.13",
]

[project.optional-dependencies]
server = ["starlette>=0.40", "uvicorn>=0.30", "python-multipart>=0.0.18", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/YauhenBichel/belarusian-asr"
Demo = "https://yauhenbichel.github.io/belarusian-asr/"
Issues = "https://github.com/YauhenBichel/belarusian-asr/issues"

[project.scripts]
belarusian-asr = "belarusian_asr.cli:main"

[tool.hatch.version]
path = "src/belarusian_asr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/belarusian_asr"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "NOTICE", "docs/BENCHMARKS.md"]
